<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VAPID 키 생성기 | My Vocabulary</title>
  <style>
    :root{color-scheme:light;--ink:#24352c;--muted:#6d7d73;--line:#dce6df;--green:#477b5b;--bg:#f5f8f5}
    *{box-sizing:border-box}body{margin:0;padding:28px 16px;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:680px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 8px 30px #203b2b0c}
    h1{font-size:24px;margin:0 0 8px}p{margin:8px 0;color:var(--muted)}.notice{padding:12px 14px;background:#f0f6f1;border-radius:10px;color:#355b40;margin:18px 0}
    button{border:0;border-radius:10px;background:var(--green);color:#fff;font-size:16px;font-weight:650;padding:13px 18px;cursor:pointer;margin:12px 0}
    button:disabled{opacity:.6;cursor:wait}.field{margin-top:18px}label{display:block;font-weight:650;margin-bottom:6px}
    textarea{width:100%;min-height:82px;resize:vertical;border:1px solid var(--line);border-radius:9px;padding:11px;font:13px/1.5 ui-monospace,monospace;color:var(--ink);background:#fbfdfb;overflow-wrap:anywhere}
    .copy{background:#e9f1eb;color:#315b3d;font-size:14px;padding:8px 12px;margin:8px 0}
    #status{min-height:24px;font-size:14px}.small{font-size:13px}.hidden{display:none}
  </style>
</head>
<body>
<main>
  <h1>푸시 알림 보안 키 생성</h1>
  <p>My Vocabulary 친구 깨우기 기능에 사용할 VAPID 키를 생성하는 페이지야.</p>
  <div class="notice"><strong>보안 안내</strong><br>키는 이 브라우저 안에서만 생성돼. 서버로 전송하거나 저장하지 않아. 특히 비밀 키는 채팅이나 공개된 곳에 올리지 마.</div>
  <button id="generate">키 생성하기</button>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="results" class="hidden">
    <div class="field">
      <label for="publicKey">공개 키 (VAPID_PUBLIC_KEY)</label>
      <textarea id="publicKey" readonly></textarea>
      <button class="copy" data-copy="publicKey">공개 키 복사</button>
    </div>
    <div class="field">
      <label for="privateKey">비밀 키 (VAPID_PRIVATE_KEY)</label>
      <textarea id="privateKey" readonly></textarea>
      <button class="copy" data-copy="privateKey">비밀 키 복사</button>
    </div>
    <p class="small">두 값을 각각 Supabase Edge Function Secrets에 등록해야 해. 비밀 키는 Supabase에만 입력하고 다른 사람과 공유하지 마.</p>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const toBase64Url = (bytes) => {
    let binary = "";
    for (const byte of bytes) binary += String.fromCharCode(byte);
    return btoa(binary).replace(/\\+/g, "-").replace(/\\//g, "_").replace(/=+$/g, "");
  };
  $("generate").addEventListener("click", async () => {
    const button = $("generate");
    button.disabled = true;
    $("status").textContent = "안전한 키를 생성하고 있어...";
    $("results").classList.add("hidden");
    try {
      if (!window.crypto || !crypto.subtle) throw new Error("보안 연결(HTTPS)에서 열어야 해.");
      const pair = await crypto.subtle.generateKey(
        { name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]
      );
      const jwk = await crypto.subtle.exportKey("jwk", pair.privateKey);
      if (!jwk.x || !jwk.y || !jwk.d) throw new Error("키 형식을 읽지 못했어. 다시 시도해 줘.");
      const decode = (value) => Uint8Array.from(atob(value.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
      const publicBytes = new Uint8Array(65);
      publicBytes[0] = 4;
      publicBytes.set(decode(jwk.x), 1);
      publicBytes.set(decode(jwk.y), 33);
      $("publicKey").value = toBase64Url(publicBytes);
      $("privateKey").value = toBase64Url(decode(jwk.d));
      $("results").classList.remove("hidden");
      $("status").textContent = "생성 완료. 비밀 키를 안전하게 보관해 줘.";
    } catch (error) {
      $("status").textContent = error.message || "키 생성에 실패했어.";
    } finally {
      button.disabled = false;
    }
  });
  document.querySelectorAll("[data-copy]").forEach(button => {
    button.addEventListener("click", async () => {
      const field = $(button.dataset.copy);
      try {
        await navigator.clipboard.writeText(field.value);
        button.textContent = "복사 완료";
      } catch {
        field.focus(); field.select();
        $("status").textContent = "자동 복사가 안 되면 선택된 값을 직접 복사해 줘.";
      }
    });
  });
})();
</script>
</body>
</html>
