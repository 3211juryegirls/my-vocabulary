
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f1e8">
  <link rel="icon" type="image/png" href="favicon.png?v=2">
  <title>My Vocabulary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div>
        <strong>My Vocabulary</strong>
        <small>나만의 영어 학습 공간</small>
      </div>
    </div>

    <div class="language-switcher">
      <label for="activeLanguage">학습 언어</label>
      <div class="language-row">
        <select id="activeLanguage"></select>
        <button class="icon-btn" id="addLanguageBtn" title="언어 추가">＋</button>
      </div>
    </div>

    <nav id="mainNav">
      <button class="nav-item active" data-page="dashboard"><span>▦</span> 대시보드</button>
      <button class="nav-item" data-page="words"><span>▤</span> 내 단어</button>
      <button class="nav-item" data-page="wordbooks"><span>▣</span> 단어장</button>
      <button class="nav-item" data-page="study"><span>◉</span> 단어 학습</button>
      <button class="nav-item" data-page="quiz"><span>✓</span> 테스트</button>
      <button class="nav-item" data-page="review"><span>↻</span> 반복 복습</button>
      <button class="nav-item" data-page="wrong"><span>!</span> 오답 노트</button>
      <button class="nav-item" data-page="statistics"><span>▥</span> 학습 통계</button>
      <button class="nav-item" data-page="goals"><span>◇</span> 목표와 보상</button>
      <button class="nav-item" data-page="friends"><span>♧</span> 친구</button>
      <button class="nav-item" data-page="settings"><span>⚙</span> 설정</button>
    </nav>

    <div class="sidebar-footer">
      <span class="status-dot"></span> 나의 학습 데이터는 안전하게 보관됩니다
    </div>
  </aside>

  <main class="main-area">
    <header class="topbar">
      <button class="mobile-menu icon-btn" id="mobileMenu">☰</button>
      <div>
        <p class="eyebrow" id="pageEyebrow">학습 현황</p>
        <h1 id="pageTitle">대시보드</h1>
      </div>
      <div class="topbar-right">
        <span class="today-label" id="todayLabel"></span>
        <span class="avatar">MV</span>
      </div>
    </header>

    <div class="content" id="pageContent"></div>
  </main>
</div>

<div class="toast" id="toast" role="status"></div>
<div class="modal-backdrop" id="modalBackdrop">
  <section class="modal" id="modal" role="dialog" aria-modal="true"></section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="my-vocabulary-auth.js?v=20261108-15"></script>
</body>
</html>
